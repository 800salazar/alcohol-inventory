# Configuración del stack local de Supabase (supabase start / db reset).
# Para el proyecto en la nube, este archivo no es necesario.
project_id = "inventario-licor"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Alta solo por administrador (Edge Function con service_role). Sin auto-registro.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "50MiB"
